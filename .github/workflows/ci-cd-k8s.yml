name: CI-CD Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  K8S_NAMESPACE: data-visualization-tool
  BACKEND_IMAGE_REPO: datascience-lab-backend
  FRONTEND_IMAGE_REPO: datascience-lab-frontend
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
  DOCKER_IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'local' }}

jobs:
  test-and-build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-and-push-images:
    needs: test-and-build-app
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.image_outputs.outputs.backend_image }}
      frontend_image: ${{ steps.image_outputs.outputs.frontend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.DOCKER_IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_REPO }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.DOCKER_IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_REPO }}:latest

      - name: Capture image references
        id: image_outputs
        run: |
          echo "backend_image=${{ env.DOCKER_IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.DOCKER_IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-to-kubernetes:
    needs: build-and-push-images
    if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && env.KUBE_CONFIG_B64 != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ env.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -k k8s

      - name: Update images and rollout
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push-images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push-images.outputs.frontend_image }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/datascience-lab-backend backend="$BACKEND_IMAGE"
          kubectl -n "$K8S_NAMESPACE" set image deployment/datascience-lab-frontend frontend="$FRONTEND_IMAGE"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/datascience-lab-backend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/datascience-lab-frontend --timeout=180s

      - name: Deployment snapshot
        run: kubectl -n "$K8S_NAMESPACE" get deploy,pods,svc,ingress
