name: CI-CD Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  K8S_NAMESPACE: data-visualization-tool
  BACKEND_IMAGE_REPO: datascience-lab-backend
  FRONTEND_IMAGE_REPO: datascience-lab-frontend

jobs:
  test-and-build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-and-push-images:
    needs: test-and-build-app
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.image_outputs.outputs.backend_image }}
      frontend_image: ${{ steps.image_outputs.outputs.frontend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Evaluate image publish settings
        id: image_publish
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
            echo "image_namespace=$DOCKERHUB_USERNAME" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "image_namespace=local" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.image_publish.outputs.can_push == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ steps.image_publish.outputs.can_push == 'true' }}
          tags: |
            ${{ steps.image_publish.outputs.image_namespace }}/${{ env.BACKEND_IMAGE_REPO }}:${{ github.sha }}
            ${{ steps.image_publish.outputs.image_namespace }}/${{ env.BACKEND_IMAGE_REPO }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api
          push: ${{ steps.image_publish.outputs.can_push == 'true' }}
          tags: |
            ${{ steps.image_publish.outputs.image_namespace }}/${{ env.FRONTEND_IMAGE_REPO }}:${{ github.sha }}
            ${{ steps.image_publish.outputs.image_namespace }}/${{ env.FRONTEND_IMAGE_REPO }}:latest

      - name: Capture image references
        id: image_outputs
        run: |
          echo "backend_image=${{ steps.image_publish.outputs.image_namespace }}/${{ env.BACKEND_IMAGE_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ steps.image_publish.outputs.image_namespace }}/${{ env.FRONTEND_IMAGE_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-to-kubernetes:
    needs: build-and-push-images
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate deploy prerequisites
        id: deploy_prereqs
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$KUBE_CONFIG_B64" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.deploy_prereqs.outputs.can_deploy == 'true' }}
        uses: actions/checkout@v4

      - name: Set up kubectl
        if: ${{ steps.deploy_prereqs.outputs.can_deploy == 'true' }}
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: ${{ steps.deploy_prereqs.outputs.can_deploy == 'true' }}
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"

      - name: Apply manifests
        if: ${{ steps.deploy_prereqs.outputs.can_deploy == 'true' }}
        run: kubectl apply -k k8s

      - name: Update images and rollout
        if: ${{ steps.deploy_prereqs.outputs.can_deploy == 'true' }}
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push-images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push-images.outputs.frontend_image }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/datascience-lab-backend backend="$BACKEND_IMAGE"
          kubectl -n "$K8S_NAMESPACE" set image deployment/datascience-lab-frontend frontend="$FRONTEND_IMAGE"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/datascience-lab-backend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/datascience-lab-frontend --timeout=180s

      - name: Deployment snapshot
        if: ${{ steps.deploy_prereqs.outputs.can_deploy == 'true' }}
        run: kubectl -n "$K8S_NAMESPACE" get deploy,pods,svc,ingress
