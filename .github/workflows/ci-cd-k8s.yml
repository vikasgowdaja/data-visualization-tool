name: CI-CD Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  K8S_NAMESPACE: data-visualization-tool
  BACKEND_IMAGE_REPO: datascience-lab-backend
  FRONTEND_IMAGE_REPO: datascience-lab-frontend

jobs:
  test-and-build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-and-push-images:
    needs: test-and-build-app
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.image_outputs.outputs.backend_image }}
      frontend_image: ${{ steps.image_outputs.outputs.frontend_image }}
      can_push: ${{ steps.image_publish.outputs.can_push }}
      has_kubeconfig: ${{ steps.image_publish.outputs.has_kubeconfig }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Evaluate image publish settings
        id: image_publish
        env:
          DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_USERNAME_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME_VAR:-$DOCKERHUB_USERNAME_SECRET}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
            echo "image_namespace=$DOCKERHUB_USERNAME" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "image_namespace=local" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$KUBE_CONFIG_B64" ]; then
            echo "has_kubeconfig=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_kubeconfig=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.image_publish.outputs.can_push == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ steps.image_publish.outputs.image_namespace }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ fromJSON(steps.image_publish.outputs.can_push) }}
          tags: |
            ${{ steps.image_publish.outputs.image_namespace }}/${{ env.BACKEND_IMAGE_REPO }}:${{ github.sha }}
            ${{ steps.image_publish.outputs.image_namespace }}/${{ env.BACKEND_IMAGE_REPO }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api
          push: ${{ fromJSON(steps.image_publish.outputs.can_push) }}
          tags: |
            ${{ steps.image_publish.outputs.image_namespace }}/${{ env.FRONTEND_IMAGE_REPO }}:${{ github.sha }}
            ${{ steps.image_publish.outputs.image_namespace }}/${{ env.FRONTEND_IMAGE_REPO }}:latest

      - name: Capture image references
        id: image_outputs
        run: |
          echo "backend_image=${{ steps.image_publish.outputs.image_namespace }}/${{ env.BACKEND_IMAGE_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ steps.image_publish.outputs.image_namespace }}/${{ env.FRONTEND_IMAGE_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-to-kubernetes:
    needs: build-and-push-images
    if: ${{ needs.build-and-push-images.outputs.can_push == 'true' && needs.build-and-push-images.outputs.has_kubeconfig == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"

      - name: Validate kubeconfig endpoint
        id: deploy_prereq
        run: |
          KUBE_SERVER="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null || true)"
          DEPLOY_READY="$({ KUBE_SERVER="$KUBE_SERVER" python3 - <<'PY'
          import ipaddress
          import os
          from urllib.parse import urlparse

          server = os.environ.get("KUBE_SERVER", "").strip().strip('"').strip("'")
          if not server:
              print("false")
          else:
              host = urlparse(server).hostname
              if not host or host.lower() == "localhost":
                  print("false")
              else:
                  try:
                      print("false" if ipaddress.ip_address(host).is_loopback else "true")
                  except ValueError:
                      print("true")
          PY
          } 2>/dev/null || echo false)"
          case "$DEPLOY_READY" in
            true|false) ;;
            *)
              DEPLOY_READY="false"
              ;;
          esac
          echo "deploy_ready=$DEPLOY_READY" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_READY" != "true" ]; then
            DEPLOY_READY="false"
            echo "Kubeconfig server is missing or local-only; skipping deploy steps."
          fi

      - name: Apply manifests
        if: ${{ steps.deploy_prereq.outputs.deploy_ready == 'true' }}
        run: kubectl apply -k k8s

      - name: Update images and rollout
        if: ${{ steps.deploy_prereq.outputs.deploy_ready == 'true' }}
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push-images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push-images.outputs.frontend_image }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/datascience-lab-backend backend="$BACKEND_IMAGE"
          kubectl -n "$K8S_NAMESPACE" set image deployment/datascience-lab-frontend frontend="$FRONTEND_IMAGE"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/datascience-lab-backend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/datascience-lab-frontend --timeout=180s

      - name: Deployment snapshot
        if: ${{ steps.deploy_prereq.outputs.deploy_ready == 'true' }}
        run: kubectl -n "$K8S_NAMESPACE" get deploy,pods,svc,ingress
