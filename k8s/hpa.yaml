apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datascience-lab-backend
  namespace: data-visualization-tool
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datascience-lab-backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datascience-lab-frontend
  namespace: data-visualization-tool
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datascience-lab-frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
