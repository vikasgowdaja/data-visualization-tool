apiVersion: v1
kind: ConfigMap
metadata:
  name: datascience-lab-backend-config
  namespace: data-visualization-tool
data:
  CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://datascience-lab.local,http://datascience-lab.127.0.0.1.nip.io
  CORS_ALLOW_CREDENTIALS: "false"
  MONGODB_DB_NAME: datascience_lab
  MONGODB_ASSIGNMENTS_COLLECTION: student_assignments
  MONGODB_SETTINGS_COLLECTION: assignment_settings
  MONGODB_STUDENTS_COLLECTION: students
